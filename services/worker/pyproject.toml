[project]
name = "ezik-worker"
version = "0.1.0"
description = "Content, image, and audio factory for Ezik (Spanish from zero -> A2)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "edge-tts>=6.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
worker = "ezik_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezik_worker"]
